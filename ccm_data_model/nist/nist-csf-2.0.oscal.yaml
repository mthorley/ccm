          ns: urn:ccm:oscal
          title: Ex2
          prose: Assign responsibilities and verify the execution of procedures for processing, analyzing the impact of, and
            responding to cybersecurity threat, vulnerability, or incident disclosures by suppliers, customers, partners,
            and government cybersecurity organizations
