          ns: urn:ccm:oscal
          title: Ex1
          prose: Monitor logs from physical access control systems (e.g., badge readers) to find unusual access patterns (e.g.,
            deviations from the norm) and failed access attempts
        - id: DE.CM-02_ex2
          name: example
          ns: urn:ccm:oscal
