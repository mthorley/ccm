          ns: urn:ccm:oscal
          title: Ex1
          prose: Monitor remote and onsite administration and maintenance activities that external providers perform on organizational
            systems
        - id: DE.CM-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Monitor activity from cloud-based services, internet service providers, and other service providers for deviations
            from expected behavior
      - id: DE.CM-09
        class: subcategory
