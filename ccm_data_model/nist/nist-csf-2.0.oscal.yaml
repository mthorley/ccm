          value: SA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: ID.RA-01_smt
          name: statement
          prose: Vulnerabilities in assets are identified, validated, and recorded
        - id: ID.RA-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use vulnerability management technologies to identify unpatched and misconfigured software
        - id: ID.RA-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Assess network and system architectures for design and implementation weaknesses that affect cybersecurity
        - id: ID.RA-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Review, analyze, or test organization-developed software to identify design, coding, and default configuration
            vulnerabilities
        - id: ID.RA-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Assess facilities that house critical computing assets for physical vulnerabilities and resilience issues
        - id: ID.RA-01_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Monitor sources of cyber threat intelligence for information on new vulnerabilities in products and services
        - id: ID.RA-01_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Review processes and procedures for weaknesses that could be exploited to affect cybersecurity
      - id: ID.RA-02
        class: subcategory
        title: Cyber threat intelligence is received from information sharing forums and sources
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: ID.RA-02_smt
          name: statement
          prose: Cyber threat intelligence is received from information sharing forums and sources
        - id: ID.RA-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Configure cybersecurity tools and technologies with detection or response capabilities to securely ingest
            cyber threat intelligence feeds
        - id: ID.RA-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Receive and review advisories from reputable third parties on current threat actors and their tactics, techniques,
            and procedures (TTPs)
        - id: ID.RA-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Monitor sources of cyber threat intelligence for information on the types of vulnerabilities that emerging
            technologies may have
      - id: ID.RA-03
        class: subcategory
        title: Internal and external threats to the organization are identified and recorded
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: ID.RA-03_smt
          name: statement
          prose: Internal and external threats to the organization are identified and recorded
        - id: ID.RA-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use cyber threat intelligence to maintain awareness of the types of threat actors likely to target the organization
            and the TTPs they are likely to use
        - id: ID.RA-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Perform threat hunting to look for signs of threat actors within the environment
        - id: ID.RA-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Implement processes for identifying internal threat actors
      - id: ID.RA-04
        class: subcategory
        title: Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: ID.RA-04_smt
          name: statement
          prose: Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded
        - id: ID.RA-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Business leaders and cybersecurity risk management practitioners work together to estimate the likelihood
            and impact of risk scenarios and record them in risk registers
        - id: ID.RA-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Enumerate the potential business impacts of unauthorized access to the organization's communications, systems,
            and data processed in or by those systems
        - id: ID.RA-04_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Account for the potential impacts of cascading failures for systems of systems
      - id: ID.RA-05
        class: subcategory
