    - id: ID.RA
      class: category
      title: Risk Assessment
      parts:
      - id: ID.RA_overview
        name: overview
        prose: The cybersecurity risk to the organization, assets, and individuals is understood by the organization
      controls:
      - id: ID.RA-01
        class: subcategory
        title: Vulnerabilities in assets are identified, validated, and recorded
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
