        - id: ID.AM-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Define criteria for prioritizing each class of assets
        - id: ID.AM-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Apply the prioritization criteria to assets
        - id: ID.AM-05_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Track the asset priorities and update them periodically or when significant changes to the organization occur
      - id: ID.AM-07
        class: subcategory
        title: Inventories of data and corresponding metadata for designated data types are maintained
        props:
