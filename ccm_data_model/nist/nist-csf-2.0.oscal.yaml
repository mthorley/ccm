  - id: PR
    class: function
    title: PROTECT
    parts:
    - id: PR_overview
      name: overview
      prose: Safeguards to manage the organization's cybersecurity risks are used
    groups:
    - id: PR.AA
      class: category
      title: Identity Management, Authentication, and Access Control
      parts:
      - id: PR.AA_overview
        name: overview
        prose: Access to physical and logical assets is limited to authorized users, services, and hardware and  managed commensurate
          with the assessed risk of unauthorized access
      controls:
      - id: PR.AA-01
        class: subcategory
        title: Identities and credentials for authorized users, services, and hardware are managed by the organization
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.AA-01_smt
          name: statement
          prose: Identities and credentials for authorized users, services, and hardware are managed by the organization
        - id: PR.AA-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Initiate requests for new access or additional access for employees, contractors, and others, and track,
            review, and fulfill the requests, with permission from system or data owners when needed
        - id: PR.AA-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Issue, manage, and revoke cryptographic certificates and identity tokens, cryptographic keys (i.e., key management),
            and other credentials
        - id: PR.AA-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Select a unique identifier for each device from immutable hardware characteristics or an identifier securely
            provisioned to the device
        - id: PR.AA-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Physically label authorized hardware with an identifier for inventory and servicing purposes
      - id: PR.AA-02
        class: subcategory
        title: Identities are proofed and bound to credentials based on the context of interactions
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: PR.AA-02_smt
          name: statement
          prose: Identities are proofed and bound to credentials based on the context of interactions
        - id: PR.AA-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Verify a person's claimed identity at enrollment time using government-issued identity credentials (e.g.,
            passport, visa, driver's license)
        - id: PR.AA-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Issue a different credential for each person (i.e., no credential sharing)
      - id: PR.AA-03
        class: subcategory
        title: Users, services, and hardware are authenticated
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.AA-03_smt
          name: statement
          prose: Users, services, and hardware are authenticated
        - id: PR.AA-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Require multifactor authentication
        - id: PR.AA-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Enforce policies for the minimum strength of passwords, PINs, and similar authenticators
        - id: PR.AA-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Periodically reauthenticate users, services, and hardware based on risk (e.g., in zero trust architectures)
        - id: PR.AA-03_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Ensure that authorized personnel can access accounts essential for protecting safety under emergency conditions
      - id: PR.AA-04
        class: subcategory
        title: Identity assertions are protected, conveyed, and verified
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.AA-04_smt
          name: statement
          prose: Identity assertions are protected, conveyed, and verified
        - id: PR.AA-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Protect identity assertions that are used to convey authentication and user information through single sign-on
            systems
        - id: PR.AA-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Protect identity assertions that are used to convey authentication and user information between federated
            systems
        - id: PR.AA-04_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Implement standards-based approaches for identity assertions in all contexts, and follow all guidance for
            the generation (e.g., data models, metadata), protection (e.g., digital signing, encryption), and verification
            (e.g., signature validation) of identity assertions
      - id: PR.AA-05
        class: subcategory
        title: Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed,
          and incorporate the principles of least privilege and separation of duties
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.AA-05_smt
          name: statement
          prose: Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed,
            and incorporate the principles of least privilege and separation of duties
        - id: PR.AA-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Review logical and physical access privileges periodically and whenever someone changes roles or leaves the
            organization, and promptly rescind privileges that are no longer needed
        - id: PR.AA-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Take attributes of the requester and the requested resource into account for authorization decisions (e.g.,
            geolocation, day/time, requester endpoint's cyber health)
        - id: PR.AA-05_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Restrict access and privileges to the minimum necessary (e.g., zero trust architecture)
        - id: PR.AA-05_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Periodically review the privileges associated with critical business functions to confirm proper separation
            of duties
      - id: PR.AA-06
        class: subcategory
        title: Physical access to assets is managed, monitored, and enforced commensurate with risk
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: PR.AA-06_smt
          name: statement
          prose: Physical access to assets is managed, monitored, and enforced commensurate with risk
        - id: PR.AA-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use security guards, security cameras, locked entrances, alarm systems, and other physical controls to monitor
            facilities and restrict access
        - id: PR.AA-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Employ additional physical security controls for areas that contain high-risk assets
        - id: PR.AA-06_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Escort guests, vendors, and other third parties within areas that contain business-critical assets
    - id: PR.AT
      class: category
      title: Awareness and Training
      parts:
      - id: PR.AT_overview
        name: overview
        prose: The organization's personnel are provided with cybersecurity awareness and training so that they can perform
          their cybersecurity-related tasks
      controls:
      - id: PR.AT-01
        class: subcategory
        title: Personnel are provided with awareness and training so that they possess the knowledge and skills to perform
          general tasks with cybersecurity risks in mind
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AT
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.AT-01_smt
          name: statement
          prose: Personnel are provided with awareness and training so that they possess the knowledge and skills to perform
            general tasks with cybersecurity risks in mind
        - id: PR.AT-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Provide basic cybersecurity awareness and training to employees, contractors, partners, suppliers, and all
            other users of the organization's non-public resources
        - id: PR.AT-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Train personnel to recognize social engineering attempts and other common attacks, report attacks and suspicious
            activity, comply with acceptable use policies, and perform basic cyber hygiene tasks (e.g., patching software,
            choosing passwords, protecting credentials)
        - id: PR.AT-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Explain the consequences of cybersecurity policy violations, both to individual users and the organization
            as a whole
        - id: PR.AT-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Periodically assess or test users on their understanding of basic cybersecurity practices
        - id: PR.AT-01_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Require annual refreshers to reinforce existing practices and introduce new practices
      - id: PR.AT-02
        class: subcategory
        title: Individuals in specialized roles are provided with awareness and training so that they possess the knowledge
          and skills to perform relevant tasks with cybersecurity risks in mind
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AT
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: PR.AT-02_smt
          name: statement
          prose: Individuals in specialized roles are provided with awareness and training so that they possess the knowledge
            and skills to perform relevant tasks with cybersecurity risks in mind
        - id: PR.AT-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Identify the specialized roles within the organization that require additional cybersecurity training, such
            as physical and cybersecurity personnel, finance personnel, senior leadership, and anyone with access to business-critical
            data
        - id: PR.AT-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Provide role-based cybersecurity awareness and training to all those in specialized roles, including contractors,
            partners, suppliers, and other third parties
        - id: PR.AT-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Periodically assess or test users on their understanding of cybersecurity practices for their specialized
            roles
        - id: PR.AT-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Require annual refreshers to reinforce existing practices and introduce new practices
    - id: PR.DS
      class: category
      title: Data Security
      parts:
      - id: PR.DS_overview
        name: overview
        prose: Data are managed consistent with the organization's risk strategy to protect the confidentiality, integrity,
          and availability of information
      controls:
      - id: PR.DS-01
        class: subcategory
        title: The confidentiality, integrity, and availability of data-at-rest are protected
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.DS-01_smt
          name: statement
          prose: The confidentiality, integrity, and availability of data-at-rest are protected
        - id: PR.DS-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use encryption, digital signatures, and cryptographic hashes to protect the confidentiality and integrity
            of stored data in files, databases, virtual machine disk images, container images, and other resources
        - id: PR.DS-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Use full disk encryption to protect data stored on user endpoints
        - id: PR.DS-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Confirm the integrity of software by validating signatures
        - id: PR.DS-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Restrict the use of removable media to prevent data exfiltration
        - id: PR.DS-01_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Physically secure removable media containing unencrypted sensitive information, such as within locked offices
            or file cabinets
      - id: PR.DS-02
        class: subcategory
        title: The confidentiality, integrity, and availability of data-in-transit are protected
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.DS-02_smt
          name: statement
          prose: The confidentiality, integrity, and availability of data-in-transit are protected
        - id: PR.DS-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use encryption, digital signatures, and cryptographic hashes to protect the confidentiality and integrity
            of network communications
        - id: PR.DS-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Automatically encrypt or block outbound emails and other communications that contain sensitive data, depending
            on the data classification
        - id: PR.DS-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Block access to personal email, file sharing, file storage services, and other personal communications applications
            and services from organizational systems and networks
        - id: PR.DS-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Prevent reuse of sensitive data from production environments (e.g., customer records) in development, testing,
            and other non-production environments
      - id: PR.DS-10
        class: subcategory
        title: The confidentiality, integrity, and availability of data-in-use are protected
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.DS-10_smt
          name: statement
          prose: The confidentiality, integrity, and availability of data-in-use are protected
        - id: PR.DS-10_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Remove data that must remain confidential (e.g., from processors and memory) as soon as it is no longer needed
        - id: PR.DS-10_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Protect data in use from access by other users and processes of the same platform
      - id: PR.DS-11
        class: subcategory
        title: Backups of data are created, protected, maintained, and tested
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.DS-11_smt
          name: statement
          prose: Backups of data are created, protected, maintained, and tested
        - id: PR.DS-11_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Continuously back up critical data in near-real-time, and back up other data frequently at agreed-upon schedules
        - id: PR.DS-11_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Test backups and restores for all types of data sources at least annually
        - id: PR.DS-11_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Securely store some backups offline and offsite so that an incident or disaster will not damage them
        - id: PR.DS-11_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Enforce geographic separation and geolocation restrictions for data backup storage
    - id: PR.PS
      class: category
      title: Platform Security
      parts:
      - id: PR.PS_overview
        name: overview
        prose: The hardware, software (e.g., firmware, operating systems, applications), and services of physical and virtual
          platforms are managed consistent with the organization's risk strategy to protect their confidentiality, integrity,
          and availability
      controls:
      - id: PR.PS-01
        class: subcategory
        title: Configuration management practices are established and applied
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.PS-01_smt
          name: statement
          prose: Configuration management practices are established and applied
        - id: PR.PS-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Establish, test, deploy, and maintain hardened baselines that enforce the organization's cybersecurity policies
            and provide only essential capabilities (i.e., principle of least functionality)
        - id: PR.PS-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Review all default configuration settings that may potentially impact cybersecurity when installing or upgrading
            software
        - id: PR.PS-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Monitor implemented software for deviations from approved baselines
      - id: PR.PS-02
        class: subcategory
        title: Software is maintained, replaced, and removed commensurate with risk
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.PS-02_smt
          name: statement
          prose: Software is maintained, replaced, and removed commensurate with risk
        - id: PR.PS-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Perform routine and emergency patching within the timeframes specified in the vulnerability management plan
        - id: PR.PS-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Update container images, and deploy new container instances to replace rather than update existing instances
        - id: PR.PS-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Replace end-of-life software and service versions with supported, maintained versions
        - id: PR.PS-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Uninstall and remove unauthorized software and services that pose undue risks
        - id: PR.PS-02_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Uninstall and remove any unnecessary software components (e.g., operating system utilities) that attackers
            might misuse
        - id: PR.PS-02_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Define and implement plans for software and service end-of-life maintenance support and obsolescence
      - id: PR.PS-03
        class: subcategory
        title: Hardware is maintained, replaced, and removed commensurate with risk
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: MA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: PR.PS-03_smt
          name: statement
          prose: Hardware is maintained, replaced, and removed commensurate with risk
        - id: PR.PS-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Replace hardware when it lacks needed security capabilities or when it cannot support software with needed
            security capabilities
        - id: PR.PS-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Define and implement plans for hardware end-of-life maintenance support and obsolescence
        - id: PR.PS-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Perform hardware disposal in a secure, responsible, and auditable manner
      - id: PR.PS-04
        class: subcategory
        title: Log records are generated and made available for continuous monitoring
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.PS-04_smt
          name: statement
          prose: Log records are generated and made available for continuous monitoring
        - id: PR.PS-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Configure all operating systems, applications, and services (including cloud-based services) to generate
            log records
        - id: PR.PS-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Configure log generators to securely share their logs with the organization's logging infrastructure systems
            and services
        - id: PR.PS-04_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Configure log generators to record the data needed by zero-trust architectures
      - id: PR.PS-05
        class: subcategory
        title: Installation and execution of unauthorized software are prevented
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.PS-05_smt
          name: statement
          prose: Installation and execution of unauthorized software are prevented
        - id: PR.PS-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: When risk warrants it, restrict software execution to permitted products only or deny the execution of prohibited
            and unauthorized software
        - id: PR.PS-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Verify the source of new software and the software's integrity before installing it
        - id: PR.PS-05_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Configure platforms to use only approved DNS services that block access to known malicious domains
        - id: PR.PS-05_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Configure platforms to allow the installation of organization-approved software only
      - id: PR.PS-06
        class: subcategory
        title: Secure software development practices are integrated, and their performance is monitored throughout the software
          development life cycle
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.PS-06_smt
          name: statement
          prose: Secure software development practices are integrated, and their performance is monitored throughout the software
            development life cycle
        - id: PR.PS-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Protect all components of organization-developed software from tampering and unauthorized access
        - id: PR.PS-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Secure all software produced by the organization, with minimal vulnerabilities in their releases
        - id: PR.PS-06_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Maintain the software used in production environments, and securely dispose of software once it is no longer
            needed
    - id: PR.IR
      class: category
      title: Technology Infrastructure Resilience
      parts:
      - id: PR.IR_overview
        name: overview
        prose: Security architectures are managed with the organization's risk strategy to protect asset confidentiality,
          integrity, and availability, and organizational resilience
      controls:
      - id: PR.IR-01
        class: subcategory
        title: Networks and environments are protected from unauthorized logical access and usage
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: PR.IR-01_smt
          name: statement
          prose: Networks and environments are protected from unauthorized logical access and usage
        - id: PR.IR-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Logically segment organization networks and cloud-based platforms according to trust boundaries and platform
            types (e.g., IT, IoT, OT, mobile, guests), and permit required communications only between segments
        - id: PR.IR-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Logically segment organization networks from external networks, and permit only necessary communications
            to enter the organization's networks from the external networks
        - id: PR.IR-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Implement zero trust architectures to restrict network access to each resource to the minimum necessary
        - id: PR.IR-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Check the cyber health of endpoints before allowing them to access and use production resources
      - id: PR.IR-02
        class: subcategory
        title: The organization's technology assets are protected from environmental threats
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: PR.IR-02_smt
          name: statement
          prose: The organization's technology assets are protected from environmental threats
        - id: PR.IR-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Protect organizational equipment from known environmental threats, such as flooding, fire, wind, and excessive
            heat and humidity
        - id: PR.IR-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Include protection from environmental threats and provisions for adequate operating infrastructure in requirements
            for service providers that operate systems on the organization's behalf
      - id: PR.IR-03
        class: subcategory
        title: Mechanisms are implemented to achieve resilience requirements in normal and adverse situations
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PL
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: PR.IR-03_smt
          name: statement
          prose: Mechanisms are implemented to achieve resilience requirements in normal and adverse situations
        - id: PR.IR-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Avoid single points of failure in systems and infrastructure
        - id: PR.IR-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Use load balancing to increase capacity and improve reliability
        - id: PR.IR-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Use high-availability components like redundant storage and power supplies to improve system reliability
      - id: PR.IR-04
        class: subcategory
        title: Adequate resource capacity to ensure availability is maintained
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SC
        parts:
        - id: PR.IR-04_smt
          name: statement
          prose: Adequate resource capacity to ensure availability is maintained
        - id: PR.IR-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Monitor usage of storage, power, compute, network bandwidth, and other resources
        - id: PR.IR-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Forecast future needs, and scale resources accordingly
  - id: DE
    class: function
    title: DETECT
    parts:
    - id: DE_overview
      name: overview
      prose: Possible cybersecurity attacks and compromises are found and analyzed
    groups:
    - id: DE.AE
      class: category
      title: Adverse Event Analysis
      parts:
      - id: DE.AE_overview
        name: overview
        prose: Anomalies, indicators of compromise, and other potentially adverse events are analyzed to characterize the
          events and detect cybersecurity incidents
      controls:
      - id: DE.AE-02
        class: subcategory
        title: Potentially adverse events are analyzed to better understand associated activities
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: DE.AE-02_smt
          name: statement
          prose: Potentially adverse events are analyzed to better understand associated activities
        - id: DE.AE-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use security information and event management (SIEM) or other tools to continuously monitor log events for
            known malicious and suspicious activity
        - id: DE.AE-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Utilize up-to-date cyber threat intelligence in log analysis tools to improve detection accuracy and characterize
            threat actors, their methods, and indicators of compromise
        - id: DE.AE-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Regularly conduct manual reviews of log events for technologies that cannot be sufficiently monitored through
            automation
        - id: DE.AE-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Use log analysis tools to generate reports on their findings
      - id: DE.AE-03
        class: subcategory
        title: Information is correlated from multiple sources
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: DE.AE-03_smt
          name: statement
          prose: Information is correlated from multiple sources
        - id: DE.AE-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Constantly transfer log data generated by other sources to a relatively small number of log servers
        - id: DE.AE-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Use event correlation technology (e.g., SIEM) to collect information captured by multiple sources
        - id: DE.AE-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Utilize cyber threat intelligence to help correlate events among log sources
      - id: DE.AE-04
        class: subcategory
        title: The estimated impact and scope of adverse events are understood
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: DE.AE-04_smt
          name: statement
          prose: The estimated impact and scope of adverse events are understood
        - id: DE.AE-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use SIEMs or other tools to estimate impact and scope, and review and refine the estimates
        - id: DE.AE-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: A person creates their own estimates of impact and scope
      - id: DE.AE-06
        class: subcategory
        title: Information on adverse events is provided to authorized staff and tools
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: DE.AE-06_smt
          name: statement
          prose: Information on adverse events is provided to authorized staff and tools
        - id: DE.AE-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use cybersecurity software to generate alerts and provide them to the security operations center (SOC), incident
            responders, and incident response tools
        - id: DE.AE-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Incident responders and other authorized personnel can access log analysis findings at all times
        - id: DE.AE-06_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Automatically create and assign tickets in the organization's ticketing system when certain types of alerts
            occur
        - id: DE.AE-06_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Manually create and assign tickets in the organization's ticketing system when technical staff discover indicators
            of compromise
      - id: DE.AE-07
        class: subcategory
        title: Cyber threat intelligence and other contextual information are integrated into the analysis
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: DE.AE-07_smt
          name: statement
          prose: Cyber threat intelligence and other contextual information are integrated into the analysis
        - id: DE.AE-07_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Securely provide cyber threat intelligence feeds to detection technologies, processes, and personnel
        - id: DE.AE-07_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Securely provide information from asset inventories to detection technologies, processes, and personnel
        - id: DE.AE-07_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Rapidly acquire and analyze vulnerability disclosures for the organization's technologies from suppliers,
            vendors, and third-party security advisories
      - id: DE.AE-08
        class: subcategory
        title: Incidents are declared when adverse events meet the defined incident criteria
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
