        parts:
        - id: GV.RM-02_smt
          name: statement
          prose: Risk appetite and risk tolerance statements are established, communicated, and maintained
        - id: GV.RM-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Determine and communicate risk appetite statements that convey expectations about the appropriate level of
            risk for the organization
        - id: GV.RM-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Translate risk appetite statements into specific, measurable, and broadly understandable risk tolerance statements
        - id: GV.RM-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Refine organizational objectives and risk appetite periodically based on known risk exposure and residual
            risk
      - id: GV.RM-03
        class: subcategory
