          ns: urn:ccm:oscal
          title: Ex3
          prose: Update policy to reflect changes in legal and regulatory requirements
        - id: GV.PO-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Update policy to reflect changes in technology (e.g., adoption of artificial intelligence) and changes to
            the business (e.g., acquisition of a new business, new contract requirements)
    - id: GV.OV
      class: category
      title: Oversight
      parts:
      - id: GV.OV_overview
        name: overview
        prose: Results of organization-wide cybersecurity risk management activities and performance are used to inform, improve,
          and adjust the risk management strategy
      controls:
      - id: GV.OV-01
        class: subcategory
        title: Cybersecurity risk management strategy outcomes are reviewed to inform and adjust strategy and direction
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.OV-01_smt
          name: statement
          prose: Cybersecurity risk management strategy outcomes are reviewed to inform and adjust strategy and direction
        - id: GV.OV-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Measure how well the risk management strategy and risk results have helped leaders make decisions and achieve
            organizational objectives
        - id: GV.OV-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Examine whether cybersecurity risk strategies that impede operations or innovation should be adjusted
      - id: GV.OV-02
        class: subcategory
        title: The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage of organizational requirements
          and risks
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.OV-02_smt
          name: statement
          prose: The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage of organizational
            requirements and risks
        - id: GV.OV-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Review audit findings to confirm whether the existing cybersecurity strategy has ensured compliance with
            internal and external requirements
        - id: GV.OV-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Review the performance oversight of those in cybersecurity-related roles to determine whether policy changes
            are necessary
        - id: GV.OV-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Review strategy in light of cybersecurity incidents
      - id: GV.OV-03
        class: subcategory
        title: Organizational cybersecurity risk management performance is evaluated and reviewed for adjustments needed
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.OV-03_smt
          name: statement
          prose: Organizational cybersecurity risk management performance is evaluated and reviewed for adjustments needed
        - id: GV.OV-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Review key performance indicators (KPIs) to ensure that organization-wide policies and procedures achieve
            objectives
        - id: GV.OV-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Review key risk indicators (KRIs) to identify risks the organization faces, including likelihood and potential
            impact
        - id: GV.OV-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Collect and communicate metrics on cybersecurity risk management with senior leadership
    - id: GV.SC
      class: category
      title: Cybersecurity Supply Chain Risk Management
      parts:
      - id: GV.SC_overview
        name: overview
        prose: Cyber supply chain risk management processes are identified, established, managed, monitored, and improved
          by organizational stakeholders
      controls:
      - id: GV.SC-01
        class: subcategory
        title: A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established
          and agreed to by organizational stakeholders
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-01_smt
          name: statement
          prose: A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established
            and agreed to by organizational stakeholders
        - id: GV.SC-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Establish a strategy that expresses the objectives of the cybersecurity supply chain risk management program
        - id: GV.SC-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Develop the cybersecurity supply chain risk management program, including a plan (with milestones), policies,
            and procedures that guide implementation and improvement of the program, and share the policies and procedures
            with the organizational stakeholders
        - id: GV.SC-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Develop and implement program processes based on the strategy, objectives, policies, and procedures that
            are agreed upon and performed by the organizational stakeholders
        - id: GV.SC-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Establish a cross-organizational mechanism that ensures alignment between functions that contribute to cybersecurity
            supply chain risk management, such as cybersecurity, IT, operations, legal, human resources, and engineering
      - id: GV.SC-02
        class: subcategory
        title: Cybersecurity roles and responsibilities for suppliers, customers, and partners are established, communicated,
          and coordinated internally and externally
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-02_smt
          name: statement
          prose: Cybersecurity roles and responsibilities for suppliers, customers, and partners are established, communicated,
            and coordinated internally and externally
        - id: GV.SC-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Identify one or more specific roles or positions that will be responsible and accountable for planning, resourcing,
            and executing cybersecurity supply chain risk management activities
        - id: GV.SC-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Document cybersecurity supply chain risk management roles and responsibilities in policy
        - id: GV.SC-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Create responsibility matrixes to document who will be responsible and accountable for cybersecurity supply
            chain risk management activities and how those teams and individuals will be consulted and informed
        - id: GV.SC-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Include cybersecurity supply chain risk management responsibilities and performance requirements in personnel
            descriptions to ensure clarity and improve accountability
        - id: GV.SC-02_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Document performance goals for personnel with cybersecurity risk management-specific responsibilities, and
            periodically measure them to demonstrate and improve performance
        - id: GV.SC-02_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Develop roles and responsibilities for suppliers, customers, and business partners to address shared responsibilities
            for applicable cybersecurity risks, and integrate them into organizational policies and applicable third-party
            agreements
        - id: GV.SC-02_ex7
          name: example
          ns: urn:ccm:oscal
          title: Ex7
          prose: Internally communicate cybersecurity supply chain risk management roles and responsibilities for third parties
        - id: GV.SC-02_ex8
          name: example
          ns: urn:ccm:oscal
          title: Ex8
          prose: Establish rules and protocols for information sharing and reporting processes between the organization and
            its suppliers
      - id: GV.SC-03
        class: subcategory
        title: Cybersecurity supply chain risk management is integrated into cybersecurity and enterprise risk management,
          risk assessment, and improvement processes
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-03_smt
          name: statement
          prose: Cybersecurity supply chain risk management is integrated into cybersecurity and enterprise risk management,
            risk assessment, and improvement processes
        - id: GV.SC-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Identify areas of alignment and overlap with cybersecurity and enterprise risk management
        - id: GV.SC-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Establish integrated control sets for cybersecurity risk management and cybersecurity supply chain risk management
        - id: GV.SC-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Integrate cybersecurity supply chain risk management into improvement processes
        - id: GV.SC-03_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Escalate material cybersecurity risks in supply chains to senior management, and address them at the enterprise
            risk management level
      - id: GV.SC-04
        class: subcategory
        title: Suppliers are known and prioritized by criticality
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-04_smt
          name: statement
          prose: Suppliers are known and prioritized by criticality
        - id: GV.SC-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Develop criteria for supplier criticality based on, for example, the sensitivity of data processed or possessed
            by suppliers, the degree of access to the organization's systems, and the importance of the products or services
            to the organization's mission
        - id: GV.SC-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Keep a record of all suppliers, and prioritize suppliers based on the criticality criteria
      - id: GV.SC-05
        class: subcategory
        title: Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated into
          contracts and other types of agreements with suppliers and other relevant third parties
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-05_smt
          name: statement
          prose: Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated
            into contracts and other types of agreements with suppliers and other relevant third parties
        - id: GV.SC-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Establish security requirements for suppliers, products, and services commensurate with their criticality
            level and potential impact if compromised
        - id: GV.SC-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Include all cybersecurity and supply chain requirements that third parties must follow and how compliance
            with the requirements may be verified in default contractual language
        - id: GV.SC-05_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Define the rules and protocols for information sharing between the organization and its suppliers and sub-tier
            suppliers in agreements
        - id: GV.SC-05_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Manage risk by including security requirements in agreements based on their criticality and potential impact
            if compromised
        - id: GV.SC-05_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Define security requirements in service-level agreements (SLAs) for monitoring suppliers for acceptable security
            performance throughout the supplier relationship lifecycle
        - id: GV.SC-05_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Contractually require suppliers to disclose cybersecurity features, functions, and vulnerabilities of their
            products and services for the life of the product or the term of service
        - id: GV.SC-05_ex7
          name: example
          ns: urn:ccm:oscal
          title: Ex7
          prose: Contractually require suppliers to provide and maintain a current component inventory (e.g., software or
            hardware bill of materials) for critical products
        - id: GV.SC-05_ex8
          name: example
          ns: urn:ccm:oscal
          title: Ex8
          prose: Contractually require suppliers to vet their employees and guard against insider threats
        - id: GV.SC-05_ex9
          name: example
          ns: urn:ccm:oscal
          title: Ex9
          prose: Contractually require suppliers to provide evidence of performing acceptable security practices through,
            for example, self-attestation, conformance to known standards, certifications, or inspections
        - id: GV.SC-05_ex10
          name: example
          ns: urn:ccm:oscal
          title: Ex10
          prose: Specify in contracts and other agreements the rights and responsibilities of the organization, its suppliers,
            and their supply chains, with respect to potential cybersecurity risks
      - id: GV.SC-06
        class: subcategory
        title: Planning and due diligence are performed to reduce risks before entering into formal supplier or other third-party
          relationships
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-06_smt
          name: statement
          prose: Planning and due diligence are performed to reduce risks before entering into formal supplier or other third-party
            relationships
        - id: GV.SC-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Perform thorough due diligence on prospective suppliers that is consistent with procurement planning and
            commensurate with the level of risk, criticality, and complexity of each supplier relationship
        - id: GV.SC-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Assess the suitability of the technology and cybersecurity capabilities and the risk management practices
            of prospective suppliers
        - id: GV.SC-06_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Conduct supplier risk assessments against business and applicable cybersecurity requirements
        - id: GV.SC-06_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Assess the authenticity, integrity, and security of critical products prior to acquisition and use
      - id: GV.SC-07
        class: subcategory
        title: The risks posed by a supplier, their products and services, and other third parties are understood, recorded,
          prioritized, assessed, responded to, and monitored over the course of the relationship
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PT
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-07_smt
          name: statement
          prose: The risks posed by a supplier, their products and services, and other third parties are understood, recorded,
            prioritized, assessed, responded to, and monitored over the course of the relationship
        - id: GV.SC-07_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Adjust assessment formats and frequencies based on the third party's reputation and the criticality of the
            products or services they provide
        - id: GV.SC-07_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Evaluate third parties' evidence of compliance with contractual cybersecurity requirements, such as self-attestations,
            warranties, certifications, and other artifacts
        - id: GV.SC-07_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Monitor critical suppliers to ensure that they are fulfilling their security obligations throughout the supplier
            relationship lifecycle using a variety of methods and techniques, such as inspections, audits, tests, or other
            forms of evaluation
        - id: GV.SC-07_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Monitor critical suppliers, services, and products for changes to their risk profiles, and reevaluate supplier
            criticality and risk impact accordingly
        - id: GV.SC-07_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Plan for unexpected supplier and supply chain-related interruptions to ensure business continuity
      - id: GV.SC-08
        class: subcategory
        title: Relevant suppliers and other third parties are included in incident planning, response, and recovery activities
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-08_smt
          name: statement
          prose: Relevant suppliers and other third parties are included in incident planning, response, and recovery activities
        - id: GV.SC-08_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Define and use rules and protocols for reporting incident response and recovery activities and the status
            between the organization and its suppliers
        - id: GV.SC-08_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Identify and document the roles and responsibilities of the organization and its suppliers for incident response
        - id: GV.SC-08_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Include critical suppliers in incident response exercises and simulations
        - id: GV.SC-08_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Define and coordinate crisis communication methods and protocols between the organization and its critical
            suppliers
        - id: GV.SC-08_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Conduct collaborative lessons learned sessions with critical suppliers
      - id: GV.SC-09
        class: subcategory
        title: Supply chain security practices are integrated into cybersecurity and enterprise risk management programs,
          and their performance is monitored throughout the technology product and service life cycle
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-09_smt
          name: statement
          prose: Supply chain security practices are integrated into cybersecurity and enterprise risk management programs,
            and their performance is monitored throughout the technology product and service life cycle
        - id: GV.SC-09_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Policies and procedures require provenance records for all acquired technology products and services
        - id: GV.SC-09_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Periodically provide risk reporting to leaders about how acquired components are proven to be untampered
            and authentic
        - id: GV.SC-09_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Communicate regularly among cybersecurity risk managers and operations personnel about the need to acquire
            software patches, updates, and upgrades only from authenticated and trustworthy software providers
        - id: GV.SC-09_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Review policies to ensure that they require approved supplier personnel to perform maintenance on supplier
            products
        - id: GV.SC-09_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Policies and procedure require checking upgrades to critical hardware for unauthorized changes
      - id: GV.SC-10
        class: subcategory
        title: Cybersecurity supply chain risk management plans include provisions for activities that occur after the conclusion
          of a partnership or service agreement
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.SC-10_smt
          name: statement
          prose: Cybersecurity supply chain risk management plans include provisions for activities that occur after the conclusion
            of a partnership or service agreement
        - id: GV.SC-10_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Establish processes for terminating critical relationships under both normal and adverse circumstances
        - id: GV.SC-10_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Define and implement plans for component end-of-life maintenance support and obsolescence
        - id: GV.SC-10_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Verify that supplier access to organization resources is deactivated promptly when it is no longer needed
        - id: GV.SC-10_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Verify that assets containing the organization's data are returned or properly disposed of in a timely, controlled,
            and safe manner
        - id: GV.SC-10_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Develop and execute a plan for terminating or transitioning supplier relationships that takes supply chain
            security risk and resiliency into account
        - id: GV.SC-10_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Mitigate risks to data and systems created by supplier termination
        - id: GV.SC-10_ex7
          name: example
          ns: urn:ccm:oscal
          title: Ex7
          prose: Manage data leakage risks associated with supplier termination
  - id: ID
    class: function
