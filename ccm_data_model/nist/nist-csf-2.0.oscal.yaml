          prose: Monitor hardware and software for signs of tampering
        - id: DE.CM-09_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Use technologies with a presence on endpoints to detect cyber health issues (e.g., missing patches, malware
            infections, unauthorized software), and redirect the endpoints to a remediation environment before access is authorized
  - id: RS
    class: function
    title: RESPOND
    parts:
    - id: RS_overview
      name: overview
      prose: Actions regarding a detected cybersecurity incident are taken
    groups:
    - id: RS.MA
      class: category
      title: Incident Management
      parts:
      - id: RS.MA_overview
        name: overview
        prose: Responses to detected cybersecurity incidents are managed
      controls:
      - id: RS.MA-01
        class: subcategory
        title: The incident response plan is executed in coordination with relevant third parties once an incident is declared
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: RS.MA-01_smt
          name: statement
          prose: The incident response plan is executed in coordination with relevant third parties once an incident is declared
        - id: RS.MA-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Detection technologies automatically report confirmed incidents
        - id: RS.MA-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Request incident response assistance from the organization's incident response outsourcer
        - id: RS.MA-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Designate an incident lead for each incident
        - id: RS.MA-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Initiate execution of additional cybersecurity plans as needed to support incident response (for example,
            business continuity and disaster recovery)
      - id: RS.MA-02
        class: subcategory
        title: Incident reports are triaged and validated
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.MA-02_smt
          name: statement
          prose: Incident reports are triaged and validated
        - id: RS.MA-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Preliminarily review incident reports to confirm that they are cybersecurity-related and necessitate incident
            response activities
        - id: RS.MA-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Apply criteria to estimate the severity of an incident
      - id: RS.MA-03
        class: subcategory
        title: Incidents are categorized and prioritized
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.MA-03_smt
          name: statement
          prose: Incidents are categorized and prioritized
        - id: RS.MA-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Further review and categorize incidents based on the type of incident (e.g., data breach, ransomware, DDoS,
            account compromise)
        - id: RS.MA-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Prioritize incidents based on their scope, likely impact, and time-critical nature
        - id: RS.MA-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Select incident response strategies for active incidents by balancing the need to quickly recover from an
            incident with the need to observe the attacker or conduct a more thorough investigation
      - id: RS.MA-04
        class: subcategory
        title: Incidents are escalated or elevated as needed
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PE
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: RA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.MA-04_smt
          name: statement
          prose: Incidents are escalated or elevated as needed
        - id: RS.MA-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Track and validate the status of all ongoing incidents
        - id: RS.MA-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Coordinate incident escalation or elevation with designated internal and external stakeholders
      - id: RS.MA-05
        class: subcategory
        title: The criteria for initiating incident recovery are applied
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.MA-05_smt
          name: statement
          prose: The criteria for initiating incident recovery are applied
        - id: RS.MA-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Apply incident recovery criteria to known and assumed characteristics of the incident to determine whether
            incident recovery processes should be initiated
        - id: RS.MA-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Take the possible operational disruption of incident recovery activities into account
    - id: RS.AN
      class: category
      title: Incident Analysis
      parts:
      - id: RS.AN_overview
        name: overview
        prose: Investigations are conducted to ensure effective response and support forensics and recovery activities
      controls:
      - id: RS.AN-03
        class: subcategory
        title: Analysis is performed to establish what has taken place during an incident and the root cause of the incident
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.AN-03_smt
          name: statement
          prose: Analysis is performed to establish what has taken place during an incident and the root cause of the incident
        - id: RS.AN-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Determine the sequence of events that occurred during the incident and which assets and resources were involved
            in each event
        - id: RS.AN-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Attempt to determine what vulnerabilities, threats, and threat actors were directly or indirectly involved
            in the incident
        - id: RS.AN-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Analyze the incident to find the underlying, systemic root causes
        - id: RS.AN-03_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Check any cyber deception technology for additional information on attacker behavior
      - id: RS.AN-06
        class: subcategory
        title: Actions performed during an investigation are recorded, and the records' integrity and provenance are preserved
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.AN-06_smt
          name: statement
          prose: Actions performed during an investigation are recorded, and the records' integrity and provenance are preserved
        - id: RS.AN-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Require each incident responder and others (e.g., system administrators, cybersecurity engineers) who perform
            incident response tasks to record their actions and make the record immutable
        - id: RS.AN-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Require the incident lead to document the incident in detail and be responsible for preserving the integrity
            of the documentation and the sources of all information being reported
      - id: RS.AN-07
        class: subcategory
        title: Incident data and metadata are collected, and their integrity and provenance are preserved
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.AN-07_smt
          name: statement
          prose: Incident data and metadata are collected, and their integrity and provenance are preserved
        - id: RS.AN-07_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Collect, preserve, and safeguard the integrity of all pertinent incident data and metadata (e.g., data source,
            date/time of collection) based on evidence preservation and chain-of-custody procedures
      - id: RS.AN-08
        class: subcategory
        title: An incident's magnitude is estimated and validated
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RS.AN-08_smt
          name: statement
          prose: An incident's magnitude is estimated and validated
        - id: RS.AN-08_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Review other potential targets of the incident to search for indicators of compromise and evidence of persistence
        - id: RS.AN-08_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Automatically run tools on targets to look for indicators of compromise and evidence of persistence
    - id: RS.CO
      class: category
      title: Incident Response Reporting and Communication
      parts:
      - id: RS.CO_overview
        name: overview
        prose: Response activities are coordinated with internal and external stakeholders as required by laws, regulations,
          or policies
      controls:
      - id: RS.CO-02
        class: subcategory
        title: Internal and external stakeholders are notified of incidents
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: RS.CO-02_smt
          name: statement
          prose: Internal and external stakeholders are notified of incidents
        - id: RS.CO-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Follow the organization's breach notification procedures after discovering a data breach incident, including
            notifying affected customers
        - id: RS.CO-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Notify business partners and customers of incidents in accordance with contractual requirements
        - id: RS.CO-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Notify law enforcement agencies and regulatory bodies of incidents based on criteria in the incident response
            plan and management approval
      - id: RS.CO-03
        class: subcategory
        title: Information is shared with designated internal and external stakeholders
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PT
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SI
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: RS.CO-03_smt
          name: statement
          prose: Information is shared with designated internal and external stakeholders
        - id: RS.CO-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Securely share information consistent with response plans and information sharing agreements
        - id: RS.CO-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Voluntarily share information about an attacker's observed TTPs, with all sensitive data removed, with an
            Information Sharing and Analysis Center (ISAC)
        - id: RS.CO-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Notify HR when malicious insider activity occurs
        - id: RS.CO-03_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Regularly update senior leadership on the status of major incidents
        - id: RS.CO-03_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Follow the rules and protocols defined in contracts for incident information sharing between the organization
            and its suppliers
        - id: RS.CO-03_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Coordinate crisis communication methods between the organization and its critical suppliers
    - id: RS.MI
      class: category
      title: Incident Mitigation
      parts:
      - id: RS.MI_overview
        name: overview
        prose: Activities are performed to prevent expansion of an event and mitigate its effects
      controls:
      - id: RS.MI-01
        class: subcategory
        title: Incidents are contained
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: RS.MI-01_smt
          name: statement
          prose: Incidents are contained
        - id: RS.MI-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Cybersecurity technologies (e.g., antivirus software) and cybersecurity features of other technologies (e.g.,
            operating systems, network infrastructure devices) automatically perform containment actions
        - id: RS.MI-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Allow incident responders to manually select and perform containment actions
        - id: RS.MI-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Allow a third party (e.g., internet service provider, managed security service provider) to perform containment
            actions on behalf of the organization
        - id: RS.MI-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Automatically transfer compromised endpoints to a remediation virtual local area network (VLAN)
      - id: RS.MI-02
        class: subcategory
        title: Incidents are eradicated
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: RS.MI-02_smt
          name: statement
          prose: Incidents are eradicated
        - id: RS.MI-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Cybersecurity technologies and cybersecurity features of other technologies (e.g., operating systems, network
            infrastructure devices) automatically perform eradication actions
        - id: RS.MI-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Allow incident responders to manually select and perform eradication actions
        - id: RS.MI-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Allow a third party (e.g., managed security service provider) to perform eradication actions on behalf of
            the organization
  - id: RC
    class: function
    title: RECOVER
    parts:
    - id: RC_overview
      name: overview
      prose: Assets and operations affected by a cybersecurity incident are restored
    groups:
    - id: RC.RP
      class: category
      title: Incident Recovery Plan Execution
      parts:
      - id: RC.RP_overview
        name: overview
        prose: Restoration activities are performed to ensure operational availability of systems and services affected by
          cybersecurity incidents
      controls:
      - id: RC.RP-01
        class: subcategory
        title: The recovery portion of the incident response plan is executed once initiated from the incident response process
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.RP-01_smt
          name: statement
          prose: The recovery portion of the incident response plan is executed once initiated from the incident response
            process
        - id: RC.RP-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Begin recovery procedures during or after incident response processes
        - id: RC.RP-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Make all individuals with recovery responsibilities aware of the plans for recovery and the authorizations
            required to implement each aspect of the plans
      - id: RC.RP-02
        class: subcategory
        title: Recovery actions are selected, scoped, prioritized, and performed
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.RP-02_smt
          name: statement
          prose: Recovery actions are selected, scoped, prioritized, and performed
        - id: RC.RP-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Select recovery actions based on the criteria defined in the incident response plan and available resources
        - id: RC.RP-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Change planned recovery actions based on a reassessment of organizational needs and resources
      - id: RC.RP-03
        class: subcategory
        title: The integrity of backups and other restoration assets is verified before using them for restoration
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.RP-03_smt
          name: statement
          prose: The integrity of backups and other restoration assets is verified before using them for restoration
        - id: RC.RP-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Check restoration assets for indicators of compromise, file corruption, and other integrity issues before
            use
      - id: RC.RP-04
        class: subcategory
        title: Critical mission functions and cybersecurity risk management are considered to establish post-incident operational
          norms
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.RP-04_smt
          name: statement
          prose: Critical mission functions and cybersecurity risk management are considered to establish post-incident operational
            norms
        - id: RC.RP-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Use business impact and system categorization records (including service delivery objectives) to validate
            that essential services are restored in the appropriate order
        - id: RC.RP-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Work with system owners to confirm the successful restoration of systems and the return to normal operations
        - id: RC.RP-04_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Monitor the performance of restored systems to verify the adequacy of the restoration
      - id: RC.RP-05
        class: subcategory
        title: The integrity of restored assets is verified, systems and services are restored, and normal operating status
          is confirmed
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.RP-05_smt
          name: statement
          prose: The integrity of restored assets is verified, systems and services are restored, and normal operating status
            is confirmed
        - id: RC.RP-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Check restored assets for indicators of compromise and remediation of root causes of the incident before
            production use
        - id: RC.RP-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Verify the correctness and adequacy of the restoration actions taken before putting a restored system online
      - id: RC.RP-06
        class: subcategory
        title: The end of incident recovery is declared based on criteria, and incident-related documentation is completed
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.RP-06_smt
          name: statement
          prose: The end of incident recovery is declared based on criteria, and incident-related documentation is completed
        - id: RC.RP-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Prepare an after-action report that documents the incident itself, the response and recovery actions taken,
            and lessons learned
        - id: RC.RP-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Declare the end of incident recovery once the criteria are met
    - id: RC.CO
      class: category
      title: Incident Recovery Communication
      parts:
      - id: RC.CO_overview
        name: overview
        prose: Restoration activities are coordinated with internal and external parties
      controls:
      - id: RC.CO-03
        class: subcategory
        title: Recovery activities and progress in restoring operational capabilities are communicated to designated internal
          and external stakeholders
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: RC.CO-03_smt
          name: statement
          prose: Recovery activities and progress in restoring operational capabilities are communicated to designated internal
            and external stakeholders
        - id: RC.CO-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Securely share recovery information, including restoration progress, consistent with response plans and information
            sharing agreements
        - id: RC.CO-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Regularly update senior leadership on recovery status and restoration progress for major incidents
        - id: RC.CO-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Follow the rules and protocols defined in contracts for incident information sharing between the organization
            and its suppliers
        - id: RC.CO-03_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Coordinate crisis communication between the organization and its critical suppliers
      - id: RC.CO-04
        class: subcategory
        title: Public updates on incident recovery are shared using approved methods and messaging
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: AU
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: IR
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: RC.CO-04_smt
          name: statement
          prose: Public updates on incident recovery are shared using approved methods and messaging
        - id: RC.CO-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Follow the organization's breach notification procedures for recovering from a data breach incident
        - id: RC.CO-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Explain the steps being taken to recover from the incident and to prevent a recurrence
