          title: Ex4
          prose: Compare actual network flows against baselines to detect deviations
        - id: DE.CM-01_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Monitor network communications to identify changes in security postures for zero trust purposes
      - id: DE.CM-02
        class: subcategory
        title: The physical environment is monitored to find potentially adverse events
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
