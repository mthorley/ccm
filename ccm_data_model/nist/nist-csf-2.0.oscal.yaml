        - id: ID.IM-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Invest in third-party assessments or independent audits of the effectiveness of the organization's cybersecurity
            program to identify areas that need improvement
        - id: ID.IM-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Constantly evaluate compliance with selected cybersecurity requirements through automated means
