          value: PS
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.RR-02_smt
          name: statement
          prose: Roles, responsibilities, and authorities related to cybersecurity risk management are established, communicated,
            understood, and enforced
        - id: GV.RR-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Document risk management roles and responsibilities in policy
        - id: GV.RR-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Document who is responsible and accountable for cybersecurity risk management activities and how those teams
            and individuals are to be consulted and informed
        - id: GV.RR-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Include cybersecurity responsibilities and performance requirements in personnel descriptions
        - id: GV.RR-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Document performance goals for personnel with cybersecurity risk management responsibilities, and periodically
            measure performance to identify areas for improvement
        - id: GV.RR-02_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Clearly articulate cybersecurity responsibilities within operations, risk functions, and internal audit functions
      - id: GV.RR-03
        class: subcategory
        title: Adequate resources are allocated commensurate with the cybersecurity risk strategy, roles, responsibilities,
          and policies
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.RR-03_smt
          name: statement
          prose: Adequate resources are allocated commensurate with the cybersecurity risk strategy, roles, responsibilities,
            and policies
        - id: GV.RR-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Conduct periodic management reviews to ensure that those given cybersecurity risk management responsibilities
            have the necessary authority
        - id: GV.RR-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Identify resource allocation and investment in line with risk tolerance and response
        - id: GV.RR-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Provide adequate and sufficient people, process, and technical resources to support the cybersecurity strategy
      - id: GV.RR-04
        class: subcategory
        title: Cybersecurity is included in human resources practices
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PS
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: SA
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.RR-04_smt
          name: statement
          prose: Cybersecurity is included in human resources practices
        - id: GV.RR-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Integrate cybersecurity risk management considerations into human resources processes (e.g., personnel screening,
            onboarding, change notification, offboarding)
        - id: GV.RR-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Consider cybersecurity knowledge to be a positive factor in hiring, training, and retention decisions
        - id: GV.RR-04_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Conduct background checks prior to onboarding new personnel for sensitive roles, and periodically repeat
            background checks for personnel with such roles
        - id: GV.RR-04_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Define and enforce obligations for personnel to be aware of, adhere to, and uphold security policies as they
            relate to their roles
