          name: statement
          prose: Inventories of software, services, and systems managed by the organization are maintained
        - id: ID.AM-02_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Maintain inventories for all types of software and services, including commercial-off-the-shelf, open-source,
            custom applications, API services, and cloud-based applications and services
        - id: ID.AM-02_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Constantly monitor all platforms, including containers and virtual machines, for software and service inventory
            changes
        - id: ID.AM-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Maintain an inventory of the organization's systems
