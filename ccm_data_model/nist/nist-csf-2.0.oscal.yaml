          name: statement
          prose: Inventories of data and corresponding metadata for designated data types are maintained
        - id: ID.AM-07_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Maintain a list of the designated data types of interest (e.g., personally identifiable information, protected
            health information, financial account numbers, organization intellectual property, operational technology data)
        - id: ID.AM-07_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Continuously discover and analyze ad hoc data to identify new instances of designated data types
        - id: ID.AM-07_ex3
          name: example
