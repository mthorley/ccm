        - id: DE.CM-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Monitor physical access controls (e.g., locks, latches, hinge pins, alarms) for signs of tampering
        - id: DE.CM-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Monitor the physical environment using alarm systems, cameras, and security guards
      - id: DE.CM-03
        class: subcategory
