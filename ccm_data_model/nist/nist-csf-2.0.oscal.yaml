        parts:
        - id: GV.RM-04_smt
          name: statement
          prose: Strategic direction that describes appropriate risk response options is established and communicated
        - id: GV.RM-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Specify criteria for accepting and avoiding cybersecurity risk for various classifications of data
        - id: GV.RM-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Determine whether to purchase cybersecurity insurance
        - id: GV.RM-04_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Document conditions under which shared responsibility models are acceptable (e.g., outsourcing certain cybersecurity
            functions, having a third party perform financial transactions on behalf of the organization, using public cloud-based
            services)
      - id: GV.RM-05
        class: subcategory
        title: Lines of communication across the organization are established for cybersecurity risks, including risks from
          suppliers and other third parties
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: GV.RM-05_smt
          name: statement
          prose: Lines of communication across the organization are established for cybersecurity risks, including risks from
            suppliers and other third parties
        - id: GV.RM-05_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Determine how to update senior executives, directors, and management on the organization's cybersecurity
            posture at agreed-upon intervals
        - id: GV.RM-05_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Identify how all departments across the organization - such as management, operations, internal auditors,
            legal, acquisition, physical security, and HR - will communicate with each other about cybersecurity risks
      - id: GV.RM-06
        class: subcategory
        title: A standardized method for calculating, documenting, categorizing, and prioritizing cybersecurity risks is established
          and communicated
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.RM-06_smt
          name: statement
          prose: A standardized method for calculating, documenting, categorizing, and prioritizing cybersecurity risks is
            established and communicated
        - id: GV.RM-06_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Establish criteria for using a quantitative approach to cybersecurity risk analysis, and specify probability
            and exposure formulas
        - id: GV.RM-06_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Create and use templates (e.g., a risk register) to document cybersecurity risk information (e.g., risk description,
            exposure, treatment, and ownership)
        - id: GV.RM-06_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Establish criteria for risk prioritization at the appropriate levels within the enterprise
        - id: GV.RM-06_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Use a consistent list of risk categories to support integrating, aggregating, and comparing cybersecurity
            risks
      - id: GV.RM-07
        class: subcategory
        title: Strategic opportunities (i.e., positive risks) are characterized and are included in organizational cybersecurity
          risk discussions
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.RM-07_smt
          name: statement
          prose: Strategic opportunities (i.e., positive risks) are characterized and are included in organizational cybersecurity
            risk discussions
        - id: GV.RM-07_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Define and communicate guidance and methods for identifying opportunities and including them in risk discussions
            (e.g., strengths, weaknesses, opportunities, and threats [SWOT] analysis)
        - id: GV.RM-07_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Identify stretch goals and document them
        - id: GV.RM-07_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Calculate, document, and prioritize positive risks alongside negative risks
    - id: GV.RR
      class: category
      title: Roles, Responsibilities, and Authorities
      parts:
      - id: GV.RR_overview
        name: overview
        prose: Cybersecurity roles, responsibilities, and authorities to foster accountability, performance assessment, and
          continuous improvement are established and communicated
      controls:
      - id: GV.RR-01
        class: subcategory
        title: Organizational leadership is responsible and accountable for cybersecurity risk and fosters a culture that
          is risk-aware, ethical, and continually improving
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: GV.RR-01_smt
          name: statement
          prose: Organizational leadership is responsible and accountable for cybersecurity risk and fosters a culture that
            is risk-aware, ethical, and continually improving
        - id: GV.RR-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Leaders (e.g., directors) agree on their roles and responsibilities in developing, implementing, and assessing
            the organization's cybersecurity strategy
        - id: GV.RR-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Share leaders' expectations regarding a secure and ethical culture, especially when current events present
            the opportunity to highlight positive or negative examples of cybersecurity risk management
        - id: GV.RR-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Leaders direct the CISO to maintain a comprehensive cybersecurity risk strategy and review and update it
            at least annually and after major events
        - id: GV.RR-01_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Conduct reviews to ensure adequate authority and coordination among those responsible for managing cybersecurity
            risk
      - id: GV.RR-02
        class: subcategory
        title: Roles, responsibilities, and authorities related to cybersecurity risk management are established, communicated,
          understood, and enforced
        props:
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CA
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: CP
        - name: sp800-53-family
          ns: urn:ccm:oscal
          value: PM
        - name: sp800-53-family
