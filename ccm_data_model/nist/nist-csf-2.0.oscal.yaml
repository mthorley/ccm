          prose: Maintain baselines of communication and data flows between the organization and third parties
        - id: ID.AM-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Maintain baselines of communication and data flows for the organization's infrastructure-as-a-service (IaaS)
            usage
        - id: ID.AM-03_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Maintain documentation of expected network ports, protocols, and services that are typically used among authorized
            systems
      - id: ID.AM-04
        class: subcategory
        title: Inventories of services provided by suppliers are maintained
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 3rd Party Risk
        parts:
        - id: ID.AM-04_smt
          name: statement
          prose: Inventories of services provided by suppliers are maintained
        - id: ID.AM-04_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Inventory all external services used by the organization, including third-party infrastructure-as-a-service
            (IaaS), platform-as-a-service (PaaS), and software-as-a-service (SaaS) offerings; APIs; and other externally hosted
            application services
        - id: ID.AM-04_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Update the inventory when a new external service is going to be utilized to ensure adequate cybersecurity
            risk management monitoring of the organization's use of that service
      - id: ID.AM-05
        class: subcategory
