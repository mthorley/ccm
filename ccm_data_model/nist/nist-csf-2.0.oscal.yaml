            systems as approved by leadership
        - id: ID.IM-02_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Exercise contingency plans for responding to and recovering from the discovery that products or services
            did not originate with the contracted supplier or partner or were altered before receipt
        - id: ID.IM-02_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
