        parts:
        - id: GV.RM-03_smt
          name: statement
          prose: Cybersecurity risk management activities and outcomes are included in enterprise risk management processes
        - id: GV.RM-03_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Aggregate and manage cybersecurity risks alongside other enterprise risks (e.g., compliance, financial, operational,
            regulatory, reputational, safety)
        - id: GV.RM-03_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Include cybersecurity risk managers in enterprise risk management planning
        - id: GV.RM-03_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Establish criteria for escalating cybersecurity risks within enterprise risk management
      - id: GV.RM-04
        class: subcategory
