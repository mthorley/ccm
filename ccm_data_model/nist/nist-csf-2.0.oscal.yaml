          name: statement
          prose: Systems, hardware, software, services, and data are managed throughout their life cycles
        - id: ID.AM-08_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Integrate cybersecurity considerations throughout the life cycles of systems, hardware, software, and services
        - id: ID.AM-08_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Integrate cybersecurity considerations into product life cycles
        - id: ID.AM-08_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Identify unofficial uses of technology to meet mission objectives (i.e., shadow IT)
        - id: ID.AM-08_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
          prose: Periodically identify redundant systems, hardware, software, and services that unnecessarily increase the
            organization's attack surface
        - id: ID.AM-08_ex5
          name: example
          ns: urn:ccm:oscal
          title: Ex5
          prose: Properly configure and secure systems, hardware, software, and services prior to their deployment in production
        - id: ID.AM-08_ex6
          name: example
          ns: urn:ccm:oscal
          title: Ex6
          prose: Update inventories when systems, hardware, software, and services are moved or transferred within the organization
        - id: ID.AM-08_ex7
          name: example
          ns: urn:ccm:oscal
          title: Ex7
          prose: Securely destroy stored data based on the organization's data retention policy using the prescribed destruction
            method, and keep and manage a record of the destructions
        - id: ID.AM-08_ex8
          name: example
          ns: urn:ccm:oscal
          title: Ex8
          prose: Securely sanitize data storage when hardware is being retired, decommissioned, reassigned, or sent for repairs
            or replacement
        - id: ID.AM-08_ex9
          name: example
          ns: urn:ccm:oscal
          title: Ex9
