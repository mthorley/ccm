        - id: GV.RM-01_smt
          name: statement
          prose: Risk management objectives are established and agreed to by organizational stakeholders
        - id: GV.RM-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Update near-term and long-term cybersecurity risk management objectives as part of annual strategic planning
            and when major changes occur
        - id: GV.RM-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Establish measurable objectives for cybersecurity risk management (e.g., manage the quality of user training,
            ensure adequate risk protection for industrial control systems)
        - id: GV.RM-01_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Senior leaders agree about cybersecurity objectives and use them for measuring and managing risk and performance
      - id: GV.RM-02
