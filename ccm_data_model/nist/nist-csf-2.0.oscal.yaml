            based on exercises performed in coordination with critical service providers and product suppliers
        - id: ID.IM-02_ex3
          name: example
          ns: urn:ccm:oscal
          title: Ex3
          prose: Involve internal stakeholders (e.g., senior executives, legal department, HR) in security tests and exercises
            as appropriate
        - id: ID.IM-02_ex4
          name: example
          ns: urn:ccm:oscal
          title: Ex4
