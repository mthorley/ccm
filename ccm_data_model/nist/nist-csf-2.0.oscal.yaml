          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: DE.AE-08_smt
          name: statement
          prose: Incidents are declared when adverse events meet the defined incident criteria
        - id: DE.AE-08_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Apply incident criteria to known and assumed characteristics of activity in order to determine whether an
            incident should be declared
        - id: DE.AE-08_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Take known false positives into account when applying incident criteria
    - id: DE.CM
