    groups:
    - id: ID.AM
      class: category
      title: Asset Management
      parts:
      - id: ID.AM_overview
        name: overview
        prose: Assets (e.g., data, hardware, software, systems, facilities, services, people) that enable the organization
          to achieve business purposes are identified and managed consistent with their relative importance to organizational
          objectives and the organization's risk strategy
      controls:
      - id: ID.AM-01
        class: subcategory
        title: Inventories of hardware managed by the organization are maintained
        props:
        - name: risk-party
          ns: urn:ccm:oscal
          value: 1st Party Risk
        parts:
        - id: ID.AM-01_smt
          name: statement
          prose: Inventories of hardware managed by the organization are maintained
        - id: ID.AM-01_ex1
          name: example
          ns: urn:ccm:oscal
          title: Ex1
          prose: Maintain inventories for all types of hardware, including IT, IoT, OT, and mobile devices
        - id: ID.AM-01_ex2
          name: example
          ns: urn:ccm:oscal
          title: Ex2
          prose: Constantly monitor networks to detect new hardware and automatically update inventories
      - id: ID.AM-02
        class: subcategory
        title: Inventories of software, services, and systems managed by the organization are maintained
        props:
        - name: risk-party
          ns: urn:ccm:oscal
